# Draws the daily koi (koi/koi.gif) from public GitHub activity for the profile
# README. The action is third-party code with contents:write, so it is pinned to
# the full commit SHA of the release it ships (v1.0.2) instead of the moving @v1.
name: Koi

on:
  schedule:
    # Just after midnight UTC, so the koi shows the day that just ended.
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/koi.yml]

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: yalongwastaken/git-koi@7305e9b1fadee6f43d3b4fa543a25d4cde79856e # v1.0.2
        with:
          body: platinum
          output-dir: koi
      - name: Install ffmpeg for the fish re-encode
        shell: bash
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Refresh the fish in the header card
        shell: bash
        run: python3 scripts/embed_koi.py
      - name: Refresh the plain-text view counter
        shell: bash
        run: python3 scripts/update_views.py
      - name: Refresh the GitHub Stats card
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python3 scripts/update_metrics.py
      - name: Commit the koi if it changed
        shell: bash
        run: |
          git add koi/koi.gif assets/header.svg assets/views.svg assets/metrics.svg scripts/content.toml README.md
          if git diff --cached --quiet; then
            echo "Nothing changed; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: draw the day's koi, refresh the view count and stats"
          git push --quiet
